<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campus Notices</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
min-height:100vh;
background:linear-gradient(135deg,#0f172a,#1e293b,#312e81,#2563eb);
background-size:400% 400%;
animation:bgMove 12s ease infinite;
color:white;
}

@keyframes bgMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.container{
max-width:1200px;
margin:auto;
padding:30px;
}

.header{
text-align:center;
margin-bottom:40px;
}

.header h1{
font-size:55px;
}

.notice-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:25px;
}

.card{
background:rgba(255,255,255,.08);
backdrop-filter:blur(20px);
border-radius:25px;
padding:25px;
border:1px solid rgba(255,255,255,.1);
}

.card h2{
margin-bottom:10px;
}

.date{
color:#93c5fd;
margin-bottom:10px;
}

.btn{
margin-top:15px;
padding:12px 20px;
border:none;
border-radius:12px;
background:linear-gradient(135deg,#2563eb,#7c3aed);
color:white;
cursor:pointer;
font-weight:bold;
}

.back{
display:inline-block;
margin-bottom:25px;
padding:12px 20px;
background:#2563eb;
color:white;
text-decoration:none;
border-radius:12px;
}

/* POPUP */

.popup{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.7);
justify-content:center;
align-items:center;
z-index:9999;
}

.popup-box{
background:white;
color:black;
width:90%;
max-width:500px;
padding:25px;
border-radius:20px;
}

.popup-box h2{
margin-bottom:15px;
}

.close-btn{
margin-top:20px;
padding:10px 18px;
border:none;
background:#2563eb;
color:white;
border-radius:10px;
cursor:pointer;
}

</style>
</head>

<body>

<div class="container">

<a href="dashboard.html" class="back">
← Dashboard
</a>

<div class="header">
<h1>📢 Campus Notices</h1>
</div>

<div class="notice-grid">

<div class="card">
<h2>📝 Mid Semester Exams</h2>
<div class="date">10 Oct 2026</div>
<p>Exam schedule released.</p>

<button class="btn"
onclick="showNotice(
'Mid Semester Exams',
'Mid semester examination schedule has been released. Check all subjects carefully.'
)">
View Notice
</button>
</div>

<div class="card">
<h2>🎉 Tech Fest Registration</h2>
<div class="date">12 Oct 2026</div>
<p>Registration now open.</p>

<button class="btn"
onclick="showNotice(
'Tech Fest Registration',
'Registration is open for Coding, Robotics, AI and Innovation Challenges.'
)">
View Notice
</button>
</div>

<div class="card">
<h2>💰 Fee Submission</h2>
<div class="date">15 Oct 2026</div>
<p>Last date announced.</p>

<button class="btn"
onclick="showNotice(
'Fee Submission',
'Last date for fee submission is 25 October. Late fees may apply after deadline.'
)">
View Notice
</button>
</div>

</div>

</div>

<!-- POPUP -->

<div class="popup" id="popup">

<div class="popup-box">

<h2 id="noticeTitle"></h2>

<p id="noticeMessage"></p>

<button class="close-btn"
onclick="closeNotice()">
Close
</button>

</div>

</div>

<script>

function showNotice(title,message){

document.getElementById("noticeTitle").innerText=title;

document.getElementById("noticeMessage").innerText=message;

document.getElementById("popup").style.display="flex";

}

function closeNotice(){

document.getElementById("popup").style.display="none";

}

</script>

</body>
</html>
