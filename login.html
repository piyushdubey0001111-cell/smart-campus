<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Login | Smart Campus</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(
135deg,
#0f172a,
#1e293b,
#312e81,
#2563eb
);
background-size:400% 400%;
animation:bgMove 10s ease infinite;
}

@keyframes bgMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.login-box{
width:400px;
padding:35px;
border-radius:25px;
background:rgba(255,255,255,.1);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,.15);
color:white;
text-align:center;
box-shadow:0 10px 40px rgba(0,0,0,.3);
}

.logo{
font-size:55px;
margin-bottom:10px;
}

h1{
margin-bottom:10px;
}

p{
opacity:.8;
margin-bottom:25px;
}

.input-box{
margin-bottom:18px;
}

.input-box input{
width:100%;
padding:14px;
border:none;
outline:none;
border-radius:12px;
background:rgba(255,255,255,.15);
color:white;
font-size:15px;
}

.input-box input::placeholder{
color:#ddd;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#3b82f6;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
transition:.3s;
}

button:hover{
background:#2563eb;
}

.back{
display:block;
margin-top:20px;
color:white;
text-decoration:none;
opacity:.8;
}

.back:hover{
opacity:1;
}

</style>
</head>

<body>

<div class="login-box">

<div class="logo">🎓</div>

<h1>Student Login</h1>

<p>Smart Campus Portal</p>

<form onsubmit="login(event)">

<div class="input-box">
<input type="text" id="username" placeholder="Student ID" required>
</div>

<div class="input-box">
<input type="password" id="password" placeholder="Password" required>
</div>

<button type="submit">
Login
</button>

</form>

<a href="index.html" class="back">
⬅ Back to Home
</a>

</div>

<script>

function login(event){

event.preventDefault();

let user =
document.getElementById("username").value;

let pass =
document.getElementById("password").value;

if(user && pass){

window.location.href="dashboard.html";

}

}

</script>

</body>
</html>
